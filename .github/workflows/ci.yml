name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only fake/test values. The app's tests run against a deterministic
      # mock research provider and local test databases; no real credentials are
      # used or referenced anywhere in this workflow.
      JWT_SECRET: ci-local-test-jwt-secret-not-used-in-production
      API_KEY_ENCRYPTION_SECRET: ci-local-test-aes-secret-0123456789abcdefg
      HATHAP_RESEARCH_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npx tsc --noEmit
      - name: Test
        working-directory: server
        run: npm test
      - name: Build
        working-directory: server
        run: npm run build

  client:
    name: Client (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Typecheck
        working-directory: client
        run: npx tsc --noEmit
      - name: Build
        working-directory: client
        run: npm run build